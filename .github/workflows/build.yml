name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          rm -rf build-src && mkdir build-src
          unzip -q lumen.zip -d build-src
          WRAPPER=$(find build-src -maxdepth 3 -name gradlew | head -1)
          echo "PROJ=$GITHUB_WORKSPACE/$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Signing key
        run: |
          KEYSTORE="$RUNNER_TEMP/lumen.jks"
          keytool -genkeypair -keystore "$KEYSTORE" -alias ci -keyalg RSA -keysize 2048 \
            -validity 3650 -storepass throwaway -keypass throwaway \
            -dname "CN=Lumen CI, O=Oakcraft, C=IN"
          {
            echo "LUMEN_KEYSTORE_FILE=$KEYSTORE"
            echo "LUMEN_KEYSTORE_PASSWORD=throwaway"
            echo "LUMEN_KEY_ALIAS=ci"
            echo "LUMEN_KEY_PASSWORD=throwaway"
          } >> "$GITHUB_ENV"

      - name: Build APKs
        working-directory: ${{ env.PROJ }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p out
          cp "$PROJ"/app/build/outputs/apk/release/*.apk out/
          cp "$PROJ"/app/build/outputs/apk/debug/*universal*.apk out/ 2>/dev/null || cp "$PROJ"/app/build/outputs/apk/debug/*.apk out/
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-apks
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lumen build ${{ github.run_number }}
          files: out/*.apk
