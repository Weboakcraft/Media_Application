name: Release APK

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner image already ships the Android SDK; this only accepts the licences
      # the build needs and makes sure the platform/build-tools are present.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      # Android refuses to install an unsigned APK, so there is always a key.
      # Your own keystore is used when the secrets are set; otherwise a throwaway one
      # is generated for this run so the artifact is installable for testing.
      # A throwaway key differs every build, so you must uninstall the previous copy
      # before installing a new one. Set the secrets for a stable signature.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LUMEN_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE="${RUNNER_TEMP}/lumen-release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            echo "Using the keystore from repository secrets."
            {
              echo "LUMEN_KEYSTORE_FILE=$KEYSTORE"
              echo "SIGNING_MODE=secrets"
            } >> "$GITHUB_ENV"
          else
            echo "No keystore secret set - generating a throwaway key for this build."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -alias ci \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass throwaway -keypass throwaway \
              -dname "CN=Lumen CI, OU=Build, O=Lumen, L=NA, S=NA, C=NA"
            {
              echo "LUMEN_KEYSTORE_FILE=$KEYSTORE"
              echo "LUMEN_KEYSTORE_PASSWORD=throwaway"
              echo "LUMEN_KEY_ALIAS=ci"
              echo "LUMEN_KEY_PASSWORD=throwaway"
              echo "SIGNING_MODE=throwaway"
            } >> "$GITHUB_ENV"
          fi

      # Files uploaded through the GitHub web UI arrive without the executable bit.
      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: |
          if [ "$SIGNING_MODE" = "secrets" ]; then
            export LUMEN_KEYSTORE_PASSWORD='${{ secrets.LUMEN_KEYSTORE_PASSWORD }}'
            export LUMEN_KEY_ALIAS='${{ secrets.LUMEN_KEY_ALIAS }}'
            export LUMEN_KEY_PASSWORD='${{ secrets.LUMEN_KEY_PASSWORD }}'
          fi
          ./gradlew --no-daemon assembleRelease

      # A debug APK as well: it is signed with the standard debug key and installs
      # over any previous debug copy, which makes repeat testing far less annoying.
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Report what was built
        run: |
          echo "### APKs" >> "$GITHUB_STEP_SUMMARY"
          echo "Signing: $SIGNING_MODE" >> "$GITHUB_STEP_SUMMARY"
          find app/build/outputs/apk -name '*.apk' -printf '%f  %s bytes\n' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: lumen-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APKs to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
